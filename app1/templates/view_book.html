<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="">
        <tr>
            <th>Cover</th>
            <th>Name</th>
            <th>Author</th>
            <th>Price</th>
            <th>Description</th>
            <th>Action</th>
        </tr>
        {% for i in data %}
        <tr>
            {% if i.cover %}
            <td><img src="{{i.cover.url}}" alt="" width="100" height="100"></td>
            {% else %}
            <td>no cover</td>
            {% endif %}
            <td>{{i.name}}</td>
            <td>{{i.author}}</td>
            <td>{{i.price}}</td>
            <td>{{i.description}}</td>
            <td><a href="{% url 'update_book' i.id %}">Update</a>
                <a href="{% url 'delete_book' i.id %}">Delete</a>
                <a href="{% url 'addcart' i.id %}">Add Cart</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="{% url 'home' %}">HOME</a>
    <br>
    <a href="{% url 'logout' %}">Logout</a>
</body>
</html>
